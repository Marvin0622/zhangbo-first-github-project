<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>张波的第一个 GitHub 项目</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Microsoft YaHei", sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }
    .card {
      width: min(720px, calc(100% - 32px));
      margin: 80px auto;
      padding: 48px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 16px 45px rgba(0, 0, 0, 0.08);
    }
    h1 { margin-top: 0; font-size: 38px; }
    p { font-size: 18px; line-height: 1.8; }
    .tag {
      display: inline-block;
      padding: 8px 14px;
      margin: 6px 6px 0 0;
      background: #eef2ff;
      border-radius: 999px;
      font-size: 15px;
    }
    button {
      margin-top: 24px;
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      background: #111827;
      color: white;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>你好，我是张波</h1>
    <p>
      这是我的第一个 GitHub 项目，也是我使用 Vibe Coding
      开始制作真实产品的第一步。
    </p>

    <div>
      <span class="tag">AI</span>
      <span class="tag">创业</span>
      <span class="tag">文旅</span>
      <span class="tag">教育</span>
    </div>

    <button onclick="showMessage()">点击这里</button>
    <p id="message"></p>
  </main>

  <script>
    function showMessage() {
      document.getElementById("message").textContent =
        "按钮运行成功：我的第一个网页已经可以工作了。";
    }
  </script>
</body>
</html>
